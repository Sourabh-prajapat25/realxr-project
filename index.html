<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealXR Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <h1>RealXR</h1>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <h2>Welcome to RealXR Club</h2>
        <p>Step into the Future of AR/VR Experience</p>
    </section>

    <!-- 3D Section -->
    <section class="three-section">
        <div id="canvas-container"></div>

        <div class="controls">
            <button id="colorBtn">Change Color</button>
            <button id="scaleBtn">Scale Object</button>
        </div>
    </section>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Controls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

    <!-- Text Support -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/geometries/TextGeometry.js"></script>

    <script src="script.js"></script>
</body>
</html>
